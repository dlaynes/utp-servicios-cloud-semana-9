  <line x1="530" y1="230" x2="620" y2="230" stroke="#334155" stroke-width="4"/>
  <polygon points="620,230 605,223 605,237" fill="#334155"/>

  <line x1="820" y1="230" x2="900" y2="230" stroke="#334155" stroke-width="4"/>
  <polygon points="900,230 885,223 885,237" fill="#334155"/>

  <text x="270" y="205" text-anchor="middle" font-size="14" font-family="Segoe UI, sans-serif" fill="#334155">HTTP</text>
  <text x="570" y="205" text-anchor="middle" font-size="14" font-family="Segoe UI, sans-serif" fill="#334155">/api/*</text>
  <text x="865" y="205" text-anchor="middle" font-size="14" font-family="Segoe UI, sans-serif" fill="#334155">JSON</text>

  <text x="550" y="640" text-anchor="middle" font-size="16" font-family="Segoe UI, sans-serif" fill="#1f2937">Entorno académico local</text>
