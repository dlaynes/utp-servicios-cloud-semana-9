  <rect x="120" y="380" width="860" height="180" rx="20" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="550" y="420" text-anchor="middle" font-size="20" font-family="Segoe UI, sans-serif" fill="#3730a3">Orquestación</text>
  <text x="550" y="450" text-anchor="middle" font-size="18" font-family="Segoe UI, sans-serif" fill="#4338ca">Docker Compose / Kubernetes</text>
