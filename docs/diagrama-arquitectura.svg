  <text x="430" y="250" text-anchor="middle" font-size="15" font-family="Segoe UI, sans-serif" fill="#5b21b6">Nginx</text>

  <rect x="620" y="180" width="200" height="100" rx="18" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="720" y="220" text-anchor="middle" font-size="20" font-family="Segoe UI, sans-serif" fill="#7f1d1d">API</text>
