apiVersion: apps/v1
kind: Deployment
metadata:
  name: datos-universidad
spec:
  replicas: 1
  selector:
    matchLabels:
      app: datos-universidad
  template:
    metadata:
      labels:
        app: datos-universidad
    spec:
      containers:
        - name: datos
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: datos
              mountPath: /usr/share/nginx/html
      volumes:
        - name: datos
          configMap:
            name: datos-universidad
